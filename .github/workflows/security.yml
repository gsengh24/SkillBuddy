name: Security

# Known-vulnerability scan of locked dependencies. Runs on dependency changes and weekly,
# because new advisories appear without any change to our code.
on:
  pull_request:
    paths:
      - "backend/uv.lock"
      - "backend/pyproject.toml"
      - "frontend/package-lock.json"
      - "frontend/package.json"
      - ".github/workflows/security.yml"
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - name: Audit locked runtime dependencies
        working-directory: backend
        run: |
          uv export --locked --no-dev --no-hashes --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --disable-pip --no-deps --strict

  node-audit:
    name: Node dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Audit locked runtime dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
