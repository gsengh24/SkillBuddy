name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-trixie
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:9.1.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      ENVIRONMENT: test
      # CI-only throwaway value; real secrets never live in the repository.
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes exact version tags only (no floating major tag).
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        # --locked also fails if uv.lock is out of date with pyproject.toml.
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Migrations (upgrade, downgrade, re-upgrade, drift check)
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Auth modules coverage (at least 90%)
        run: >-
          uv run coverage report --fail-under=90 --show-missing
          --include="app/services/auth/*,app/api/v1/auth.py,app/api/v1/account.py,app/api/deps.py,app/api/session_cookies.py,app/core/security.py"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Validate Compose files
        env:
          SECRET_KEY: validate-only-placeholder-value-0000000000
          DATABASE_URL: postgresql+psycopg://u:p@db:5432/app
          REDIS_URL: redis://:p@valkey:6379/0
          CORS_ALLOW_ORIGINS: https://app.example.com
          POSTGRES_USER: u
          POSTGRES_PASSWORD: p
          POSTGRES_DB: app
          REDIS_PASSWORD: p
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

      - uses: docker/setup-buildx-action@v4

      - name: Build backend runtime image
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: runtime
          push: false
          build-args: APP_VERSION=${{ github.sha }}
          tags: matchmaking/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend runtime image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          target: runtime
          push: false
          tags: matchmaking/web:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  smoke:
    name: Smoke
    # Boots the whole dev stack, so run it only once the cheap checks have passed.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      # The dev containers run as uid 1000 with the checkout bind-mounted; the Next.js dev
      # server writes into frontend/, which the runner user (uid 1001) owns.
      - name: Let the containers write to the bind-mounted frontend
        run: chmod -R a+rwX frontend

      - name: Start the stack and wait until every service is healthy
        run: docker compose up --build --detach --wait --wait-timeout 600

      - name: Smoke checks
        run: bash .github/scripts/smoke.sh

      - name: Service status and logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the full history, not just the latest commit

      - name: Install gitleaks (verified against the release checksums)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "${archive}" gitleaks

      - name: Scan the repository history for secrets
        run: ./gitleaks git --redact --verbose --exit-code 1 .

      - name: Check .env files are ignored
        run: bash .github/scripts/check-env-ignored.sh
