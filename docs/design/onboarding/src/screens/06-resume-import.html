      <b>Drop your resume PDF here or choose a file</b>

<template data-variant="2 · Reading" data-note="Runs in the browser in a second or two. The bar is a static snapshot (no looping animation). Cancel throws the text away.">
<div class="app">
  <!--#include ob-head step=2-->
  <div class="ob">
    <div class="ob-head fu">
      <h1 class="h-page">Reading your resume… <span class="t2">This takes a moment.</span></h1>
    </div>
    <section class="panel fu2" style="display:grid;gap:16px" aria-live="polite">
      <div class="fileline"><span class="ic"><!--#icon file--></span><div><strong>aarav-resume.pdf</strong><span class="mono">1 page · 184 KB</span></div><span class="mono">60%</span></div>
      <div class="bar" role="progressbar" aria-label="Reading your resume" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100"><i style="width:60%"></i></div>
      <ul class="plist">
        <li class="done"><span class="ck"><!--#icon check--></span>Text read in your browser</li>
        <li class="now"><span class="ck"></span>Removing phone numbers, emails and addresses</li>
        <li><span class="ck"></span>Finding skills, interests and projects</li>
      </ul>
    </section>
    <p class="body2 fu3">We remove phone numbers, emails and addresses before anything else happens.<span class="draft">Draft copy</span></p>
  </div>
  <footer class="ob-foot">
    <button class="btn btn-ghost is-focus" type="button">Cancel</button>
  </footer>
</div>
</template>
