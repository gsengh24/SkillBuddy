<div class="app">
  <header class="ob-top"><!--#include logo--><span class="mono">Review</span></header>
  <div class="ob-bar"><div class="steps" data-step="5" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div>
  <div class="ob">
    <div class="ob-head fu">
      <p class="mono eyebrow">Your profile</p>
      <h1 class="h-page">Here's how others will see you.</h1>
      <p class="lede">Matches see this card, never your name. Names show only after you both accept an intro.<span class="draft">Draft copy</span></p>
    </div>
    <!--#include s5-{{card}}-->
    <label class="field fu3">
      <span class="flabel">About you <span class="opt">Used for matching</span></span>
      <span class="tbox {{focus}}"><textarea maxlength="500" rows="3">Offers: React, Figma, UI design. Wants: a backend partner. Into: chess, ML hackathons.</textarea><span class="mono counter">86 / 500</span></span>
      <span class="hint">We wrote this from your picks. Change anything that's off.</span>
    </label>
  </div>
  <footer class="ob-foot">
    <button class="btn btn-ghost" type="button">Edit</button>
    <span class="grow"></span>
    <button class="btn btn-primary" type="button">Looks good <!--#icon arrow--></button>
  </footer>
</div>
