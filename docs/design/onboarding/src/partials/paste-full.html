<div class="app">
  <!--#include ob-head step=2-->
  <div class="ob">
    <a class="back" href="#"><!--#icon back-->Back to skills</a>
    <div class="ob-head fu">
      <h1 class="h-page">Paste anything about you. <span class="t2">LinkedIn About, resume, a portfolio blurb.</span></h1>
    </div>
    <label class="field fu2">
      <span class="sr">Text about you</span>
      <span class="tbox {{focus}}"><textarea maxlength="2000" rows="9" placeholder="Paste here">Second-year CSE student at Thapar. I build mobile and web apps with Flutter and React, and I design most of my own screens in Figma. Shipped a campus events app used by two societies, and I'm working on an expense tracker. Learning Node.js and SQL so I can build the backend too. Weekend hackathon regular, mostly ML tracks. Off-screen: chess and street photography.</textarea><span class="mono counter">366 / 2000</span></span>
      <span class="hint">We pick out skills and interests. You'll confirm everything.</span>
    </label>
  </div>
  <footer class="ob-foot">
    <button class="btn btn-ghost" type="button">Cancel</button>
    <span class="grow"></span>
    <button class="btn btn-primary" type="button" >Find my skills</button>
  </footer>
</div>
